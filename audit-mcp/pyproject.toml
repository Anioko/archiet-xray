[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archiet-audit-mcp"
version = "0.1.2"
description = "Architecture audit MCP server — submit architecture docs from any AI coding agent and get back a consulting-grade traceability audit at a shareable URL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Archiet", email = "aniekan.okono@archiet.dev" }]
keywords = ["architecture-audit", "mcp", "ai-agents", "architecture-review", "traceability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://archiet.com/audit-my-architecture"
Repository = "https://github.com/Anioko/archiet-xray"

[project.scripts]
archiet-audit-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
